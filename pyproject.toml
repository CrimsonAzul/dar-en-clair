[project]
name = "darenclair"
version = "0.1.0"
description = "Assistant RAG sur la location, la vente immobiliere, la fiscalite et la copropriete au Maroc"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pyyaml>=6.0",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.0",
    "FlagEmbedding>=1.2",
    "google-genai>=1.0",
]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Fine-tuning LoRA : installer torch avec CUDA d'abord
# (pip install torch --index-url https://download.pytorch.org/whl/cu126)
train = ["sentence-transformers>=3.3", "peft>=0.13", "datasets>=3.0", "accelerate>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "E741", "SIM905"]
