services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: darenclair
      POSTGRES_PASSWORD: darenclair
      POSTGRES_DB: darenclair
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darenclair"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://darenclair:darenclair@db:5432/darenclair
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
